<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <link rel="stylesheet" href="main.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div id="container">
        <div id="calculator">
            <div id="visor">
                <div id="result"></div>
                <button class="operator" id="delete" value="delete">⌫</button>
            </div>
            <div id="numbers">
                <button class="num" value="9">9</button>
                <button class="num" value="8">8</button>
                <button class="num" value="7">7</button>
                <button class="num" value="6">6</button>
                <button class="num" value="5">5</button>
                <button class="num" value="4">4</button>
                <button class="num" value="3">3</button>
                <button class="num" value="2">2</button>
                <button class="num" value="1">1</button>
                <button class="num" value="0">0</button>
                <button class="operator" id="enter" value="enter">=</button>
            </div>
            <div id="operators">
                <button class="operator" value="sum">+</button>
                <button class="operator" value="subtract">-</button>
                <button class="operator" value="multiply">*</button>
                <button class="operator" value="divide">/</button>
            </div>
            
        </div>
    </div>
    
</body>
</html>
